version: "2"

linters:
  exclusions:
    rules:
      - path: ^(scripts/capture-tls/)?main\.go$
        linters:
          - maintidx
      - path: scripts/capture-tls/main\.go$
        linters:
          - gosec
        text: 'G(401|501|204):'
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gosec
    - gosmopolitan
    - goprintffuncname
    - inamedparam
    - interfacebloat
    - iface
    - intrange
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - recvcheck
    - reassign
    - rowserrcheck
    - sloglint
    - spancheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint

run:
  concurrency: 4
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0

formatters:
  enable:
    - gofumpt
    - goimports
